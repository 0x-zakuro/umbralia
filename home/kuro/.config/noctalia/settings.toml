config_version = 14

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.0
    capsule = true
    capsule_opacity = 0.84999998100101948
    capsule_padding = 8.0
    capsule_radius = 5
    capsule_thickness = 0.84999998472630978
