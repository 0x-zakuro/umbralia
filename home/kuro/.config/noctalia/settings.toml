[notification]
background_opacity = 0.99999997764825821
border = false
history_retention_hours = 168
max_visible = 3
offset_x = 16
offset_y = 6
scale = 0.90000000596046448

[osd]
border = false

[plugins]
enabled = []

[shell]
avatar_path = "/home/kuro/.config/wallpaper/avatar.jpg"
corner_radius_scale = 0.90000001341104507
external_ip_enabled = true
font_family = "Liberation Sans"
password_style = "random"
polkit_agent = true
settings_window_translucent = false
screen_time_enabled = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    auto_paste = "ctrl_v"
    categories = false
    compact = true
    fetch_exchange_rates = false
    show_app_origin_indicator = false

        [shell.launcher.providers.calculator]
        global = false

    [shell.panel]
    control_center_position = "auto"
    open_near_click_control_center = true
    transparency_mode = "soft"
    wallpaper_placement = "floating"
    wallpaper_position = "bottom_center"

    [shell.screenshot]
    annotate = true
    directory = "/home/kuro/Pictures/Screenshots"

    [shell.session]
    grid = true
    grid_columns = 5

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "3"
        variant = "default"

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "4"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "5"
        variant = "destructive"

[theme]
community_palette = "Aura"
custom_palette = "oxocarbon"
mode = "dark"
source = "custom"
wallpaper_scheme = "dysfunctional"

    [theme.templates]
    builtin_ids = [ "foot", "gtk3", "gtk4", "umbriel" ]
    community_ids = [ "zed", "yazi", "obsidian" ]

[wallpaper]
directory = "/home/kuro/.config/wallpaper/"
directory_dark = "/home/kuro/.config/wallpaper/dark_wallpaper/"
directory_light = "/home/kuro/.config/wallpaper/light_wallpaper/"
transition = [ "wipe" ]
transition_on_startup = true

    [wallpaper.automation]
    enabled = true
    interval_seconds = 3600

    [wallpaper.default]
    path = "/home/kuro/.config/wallpaper/homescreen.jpg"

    [wallpaper.last]
    path = "/home/kuro/.config/wallpaper/homescreen.jpg"

    [wallpaper.monitors.WL-1]
    path = "/home/kuro/.config/wallpaper/dark_wallpaper/D-5.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/kuro/.config/wallpaper/light_wallpaper/D-5.jpg"

    [[wallpaper.favorite]]
    path = "/home/kuro/.config/wallpaper/light_wallpaper/D-5.jpg"
    theme_mode = "auto"

