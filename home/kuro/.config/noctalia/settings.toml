    end = [ "media", "tray", "clipboard", "battery", "group:g1" ]
    font_family = "Liberation Sans"
    font_weight = 700
    margin_ends = 0
    padding = 20
    radius = 8
    scale = 1.1000000089406967
    shadow = false
    start = [ "clock", "workspaces" ]
    thickness = 40
    widget_spacing = 10

        [bar.default.dead_zone.actions]
        left = "wallpaper-random"
        right = "theme-mode-toggle"
        scroll_down = "brightness-down"
        scroll_up = "brightness-up"

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "wallpaper", "control-center" ]
        opacity = 0.85000002384185791
        padding = 8.0
        radius = 5.0

