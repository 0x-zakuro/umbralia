# =============================================================================
# Umbriel Config
# =============================================================================

# -----------------------------------------------------------------------------
# General session behavior
# -----------------------------------------------------------------------------
[general]
autostart = ["noctalia", "sh -c 'sleep 1 && noctalia msg session lock'"]  # list of commands run once when the session starts
xwayland = false                              # enables Xwayland app support; requires xwayland-satellite; restart to apply
show_cheatsheet = false                       # true | false; show the keybind overlay on startup
focus_on_activate = false                     # true | false; allow apps to request focus via activation protocol
honor_restored_maximize = false               # true | false; restore a window's saved maximized state on session restore

# -----------------------------------------------------------------------------
# External config includes
# -----------------------------------------------------------------------------
[include]                                     # files merged in if present; missing paths are skipped without error
files = ["noctalia.toml"]

# -----------------------------------------------------------------------------
# Output / monitor setup
# -----------------------------------------------------------------------------
[output.eDP-1]                                # section name is the output/connector name (see `umbriel outputs`)
mode = "2560x1440@144"                        # format: "WIDTHxHEIGHT" or "WIDTHxHEIGHT@HZ"
scale = 1.25                                  # output scale factor; logical size = physical mode size / scale
vrr = "fullscreen"                            # disabled | always | fullscreen
hdr = "auto"                                  # off | on | auto | fullscreen
workspaces = 10                               # number of fixed workspace slots on this output; omit for dynamic count
workspace_axis = "horizontal"                 # horizontal | vertical; direction workspaces are laid out/switched

# -----------------------------------------------------------------------------
# Workspace behavior
# -----------------------------------------------------------------------------
[workspaces]
back_and_forth = false                        # true | false; switching to the already-active workspace goes to the previous one instead
empty_above = false                           # true | false; keep one empty workspace above the highest occupied index

# -----------------------------------------------------------------------------
# Appearance: colors, decoration, blur, shadow
# -----------------------------------------------------------------------------
[colors.border]
focused = "#9a9a9a"                           # hex color of the focused window's border

[appearance]
prefer_no_csd = true                          # true | false; true uses Umbriel's border-only decoration instead of app CSD
border_width = 2                              # integer, 0-100 logical px
outer_border_width = 2                        # integer, 0-100 logical px; additional ring outside border_width
corner_radius = 10                            # integer, 0-100 logical px
drag_opacity = 0.65                           # float, 0.0-1.0; window opacity while being dragged

[appearance.blur]
enabled = false                               # true | false; master toggle for background blur
optimized = true                              # true | false; share one cached blur buffer per output instead of per window
passes = 2                                    # integer, 0-8; number of blur passes
radius = 10                                   # integer, 0-100; blur radius
noise = 0.3                                   # float, 0.0-1.0; noise overlay applied to the blurred area
brightness = 1                                # float, 0.0-2.0
contrast = 0.9                                # float, 0.0-2.0
saturation = 1                                # float, 0.0-2.0

[appearance.shadow]
enabled = true                                # true | false; draw shadows behind non-fullscreen windows
softness = 10                                 # integer, 0-200; gaussian softness, 0 is a hard edge
offset_x = 2                                  # integer, -200 to 200 logical px
offset_y = 2                                  # integer, -200 to 200 logical px

# -----------------------------------------------------------------------------
# Input: keyboard, touchpad, mouse, tablet, cursor, focus
# -----------------------------------------------------------------------------
[input]
middle_click_paste = true                     # true | false; paste the primary selection on middle click
window_drag_toggle = "none"                   # none | floating | pinned; state a drag switches the window into

[input.keyboard]
layout = ""                                   # XKB layout code(s), e.g. "us,de"; empty uses the system default
variant = ""                                  # XKB variant per layout, e.g. ",nodeadkeys"; empty uses the default variant
options = ""                                  # XKB options, e.g. "grp:alt_shift_toggle"
repeat_rate = 25                              # integer, 0-1000; key repeats per second once repeating starts
repeat_delay = 600                            # integer, 0-10000 ms; delay before a held key starts repeating
numlock_toggle = true                         # true | false; true forces numlock on when a keyboard connects
track_layout = "global"                       # global | window; scope of the active-layout selection

[input.touchpad]
tap = true                                    # true | false; enable tap-to-click

[input.mouse]
sensitivity = 0.0                             # float, -1.0 to 1.0; pointer acceleration
scroll_wheel_step = 60                        # integer, 1-1000; logical px scrolled per wheel notch

[input.tablet]
enabled = true                                # true | false; false disables all tablet tools and pads

[input.cursor]
theme = ""                                    # Xcursor theme name; empty uses the environment/system default
size = 24                                     # integer, 1-512 logical px
hardware_cursor = true                        # true | false; false forces the cursor to be software-composited
follows_focus = false                         # true | false; warp the cursor to a window when it receives focus
hide_when_typing = false                      # true | false; hide the cursor while typing
hide_timeout_ms = 0                           # integer, 0-3600000; idle time before auto-hiding, 0 disables

[input.focus]
follows_mouse = true                          # true | false; focus the window under the pointer on pointer motion

# -----------------------------------------------------------------------------
# Keybinds
# -----------------------------------------------------------------------------
[keybinds]                                    # each entry is "Modifier+Key" = action string, or a table with extra fields

# Screenshots & session
"Mod+S" = { action = "spawn:noctalia msg screenshot-fullscreen" }
"Mod+Shift+S" = { action = "spawn:noctalia msg screenshot-region" }
"Mod+Shift+L" = { action = "spawn:noctalia msg session lock" }
"Mod+Escape" = "session-quit"
"Mod+Return" = "cheatsheet-toggle"

# App launching / windows
"Mod+A" = "spawn:foot"
"Mod" = "spawn:noctalia msg panel-toggle launcher"  # bound to Mod alone, no additional key
"Mod+Q" = "window-close"
"Mod+T" = "window-toggle-floating"
"Mod+F" = "window-toggle-fullscreen"
"Mod+O" = { action = "overview-toggle", repeat = false }  # repeat = false: holding the key does not repeat the action
"Mod+R" = "window-cycle-primary-extent"       # cycles through the fractions in layout.extent_presets

# Focus movement: arrow keys and vim-style (H/J/K/L) equivalents
"Mod+Left" = "window-focus-left"
"Mod+Down" = "window-focus-down"
"Mod+Up" = "window-focus-up"
"Mod+Right" = "window-focus-right"
"Mod+H" = "window-focus-left"
"Mod+J" = "window-focus-down"
"Mod+K" = "window-focus-up"
"Mod+L" = "window-focus-right"

# Window/column movement and sizing
"Mod+Shift+Left" = "column-move-left"
"Mod+Shift+Down" = "window-move-down"
"Mod+Shift+Up" = "window-move-up"
"Mod+Shift+Right" = "column-move-right"
"Mod+Comma" = "window-consume-left"           # merge the column/window to the left into the current column
"Mod+Period" = "window-consume-right"         # merge the column/window to the right into the current column
"Mod+Ctrl+Left" = "window-modify-width-left:0.05"  # trailing number is the resize step as a fraction of usable width/height
"Mod+Ctrl+Right" = "window-modify-width-right:0.05"
"Mod+Ctrl+Up" = "window-modify-height-up:0.05"
"Mod+Ctrl+Down" = "window-modify-height-down:0.05"

# Workspaces: switch (1-9) and move focused window to (Shift+1-9)
"Mod+1" = "workspace-switch:1"
"Mod+2" = "workspace-switch:2"
"Mod+3" = "workspace-switch:3"
"Mod+4" = "workspace-switch:4"
"Mod+5" = "workspace-switch:5"
"Mod+6" = "workspace-switch:6"
"Mod+7" = "workspace-switch:7"
"Mod+8" = "workspace-switch:8"
"Mod+9" = "workspace-switch:9"
"Mod+Shift+1" = "window-move-to-workspace:1"
"Mod+Shift+2" = "window-move-to-workspace:2"
"Mod+Shift+3" = "window-move-to-workspace:3"
"Mod+Shift+4" = "window-move-to-workspace:4"
"Mod+Shift+5" = "window-move-to-workspace:5"
"Mod+Shift+6" = "window-move-to-workspace:6"
"Mod+Shift+7" = "window-move-to-workspace:7"
"Mod+Shift+8" = "window-move-to-workspace:8"
"Mod+Shift+9" = "window-move-to-workspace:9"

# Scratchpad
"Mod+Shift+Space" = "window-move-to-scratchpad"
"Mod+Space" = "scratchpad-toggle"
"Mod+Ctrl+Space" = "window-restore-from-scratchpad"
"Mod+Tab" = "scratchpad-focus-next"

# Media and brightness
"XF86AudioRaiseVolume" = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+"
"XF86AudioLowerVolume" = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"
"XF86AudioMute" = "spawn:wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
"XF86MonBrightnessDown" = { action = "spawn:noctalia msg brightness-down 10", allow_when_locked = true }  # allow_when_locked = true: works from the lock screen
"XF86MonBrightnessUp" = { action = "spawn:noctalia msg brightness-up 10", allow_when_locked = true }

# -----------------------------------------------------------------------------
# Layout: tiling mode, gaps, struts, and per-mode sizing
# -----------------------------------------------------------------------------
[layout]
mode = "dwindle"                              # scrolling | dwindle | master; default tiling mode, overridable per workspace
gap = 20                                      # integer, 0-500 logical px; gap between tiles
extent_presets = [0.25, 0.5, 0.75]            # array of floats, 0.0-1.0; width/height fractions cycled by window-cycle-primary-extent

[layout.struts]                               # signed logical px reserved beyond panel exclusive zones, per edge
left = 0                                      # integer, -65535 to 65535; negative values expand the tiled area past this edge
right = 0                                     # integer, -65535 to 65535
top = 0                                       # integer, -65535 to 65535
bottom = 0                                    # integer, -65535 to 65535

[layout.scrolling]                            # applies when layout.mode = "scrolling"
default_extent_fraction = 0.5                  # float, 0.1-1.0; initial width of a newly created column
center_underfull_strip = true                 # true | false; center the strip when it is narrower than the viewport
center_focused = "never"                      # never | always | on_overflow; when to re-center the focused column

[layout.dwindle]                              # applies when layout.mode = "dwindle"
new_exits_fullscreen = true                   # true | false; opening a new window in the workspace exits fullscreen

[layout.master]                               # applies when layout.mode = "master"
position = "left"                             # left | right | center; placement of the master area
default_width_fraction = 0.55                 # float, 0.1-0.9; width of the master area
new_on_top = true                             # true | false; true inserts new windows at the top of the stack
new_becomes_master = false                    # true | false; true makes a new window the master instead of joining the stack

# -----------------------------------------------------------------------------
# Window rules
# -----------------------------------------------------------------------------
# Selectorless: applies to every window; kept first so later rules can override it
[[window_rule]]
blur = true
blur_optimized = false                        # false forces a per-window blur pass instead of the shared cached one

[[window_rule]]
opacity = 0.95                                # float, 0.0-1.0

# Noctalia shell windows
[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"      # regex matched against the window's app_id
default_floating = true
default_floating_size_px = { width = 1020, height = 700 }  # initial floating size in physical px

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }   # [width, height] in logical px

# Browsers expose no semantic PiP role, so match by window title instead
[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"  # regex matched against the window title
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }  # x/y offset from the given anchor corner

# Steam notification toasts: pin bottom-right without stealing focus
[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused = false                       # true | false; whether the window is given focus when it opens
default_pinned = true                         # true | false; pinned windows stay visible across workspace switches

# Dim windows by opacity based on focus state
[[window_rule]]
match.is_focused = false                      # state-aware selector; updates live as focus changes
opacity = 0.85

[[window_rule]]
match.is_focused = true
opacity = 1.0

# -----------------------------------------------------------------------------
# Layer rules (panels, launcher, notifications, dock, OSD, widgets)
# -----------------------------------------------------------------------------
# Blur every Noctalia shell surface; run `umbriel layers` to list live namespaces
[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"  # regex matched against the layer-shell surface namespace
blur = true
blur_ignore_alpha = 0.5                       # float, 0.0-1.0; blur through pixels with alpha at or above this value
blur_popups = true                            # true | false; also blur behind popups spawned by this layer surface
blur_optimized = false

# -----------------------------------------------------------------------------
# Animation
# -----------------------------------------------------------------------------
[animation]                                   # defaults inherited by any [animation.*] event table below that omits a field
enabled = true                                # true | false; master switch for all animation
duration_ms = 1000                            # integer, 1-10000 ms
curve = "easeout"                             # built-in curve name, or a name defined in [animation.beziers]/[animation.springs]

[animation.windows_in]                        # triggered when a window opens
enabled = true
duration_ms = 200
curve = "myBounce"                            # references [animation.springs] below
style = "slide"                               # popin | zoom | slide | fade | none

[animation.windows_out]                       # triggered when a window closes
enabled = true
duration_ms = 200
curve = "easeout"
style = "fade"                                # fade | slide

[animation.windows_move]                      # triggered by moving, resizing, or floating-maximize
enabled = true
duration_ms = 300
curve = "snappy"                              # built-in curve name

[animation.workspaces]                        # triggered by switching workspaces
enabled = true
duration_ms = 230
curve = "myBezier"                            # references [animation.beziers] below

[animation.overview]                          # triggered by opening/closing the workspaces overview
enabled = true
duration_ms = 250
curve = "easeout"
workspace_curve = "spring:1,1000"             # inline spring syntax: "spring:DAMPING,STIFFNESS"

[animation.scratchpad]                        # triggered by scratchpad show/hide and its backdrop
enabled = true
duration_ms = 190
curve = "myBounce"
dim = 0.45                                    # float, 0.0-1.0; backdrop dim amount behind the scratchpad
blur = true                                   # true | false; requires appearance.blur.enabled = true to have an effect
scale = 0.92                                  # float, 0 or 0.1-1.0; 0 keeps geometry unchanged, otherwise centers and scales the window
maximize = false                              # true | false; animate the transition for maximized scratchpad windows
fullscreen = false                            # true | false; animate the transition for fullscreen scratchpad windows

[animation.border]                            # triggered by the focus border color change
enabled = true
duration_ms = 150
curve = "easeout"

[animation.dim_unfocused]                     # triggered by the unfocused-window dim effect
enabled = true
duration_ms = 200
curve = "easeout"
dim = 0.15                                    # float, 0.0-1.0; 0 disables dimming

[animation.layers]                            # triggered by layer-shell surfaces mapping/unmapping
enabled = true
duration_ms = 160
curve = "easeout"

[animation.beziers]                           # custom cubic-bezier curves: NAME = [x1, y1, x2, y2]
myBezier = [0.16, 1, 0.3, 1]                  # referenced as curve = "myBezier" above

[animation.springs]                           # custom spring curves: NAME = { damping = ..., stiffness = ... }
myBounce = { damping = 0.65, stiffness = 260 }  # damping 0.0-1.0, stiffness > 0; referenced as curve = "myBounce" above

# -----------------------------------------------------------------------------
# Workspaces overview
# -----------------------------------------------------------------------------
[overview]
zoom = 0.75                                   # float, 0.1-0.75; workspace scale while the overview is open
scroll_factor_horizontal = 1.0                # float, 0.1-10.0; wheel/gesture multiplier, left and right
scroll_factor_vertical = 1.0                  # float, 0.1-10.0; wheel/gesture multiplier, up and down
